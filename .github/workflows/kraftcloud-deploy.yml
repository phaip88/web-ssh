name: Deploy to Unikraft Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install KraftKit
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://get.kraftkit.sh | sh
          echo "$HOME/.kraftkit/bin" >> $GITHUB_PATH
          echo "/root/.kraftkit/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Deploy to Unikraft Cloud
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          KRAFTCLOUD_TOKEN: ${{ secrets.UKC_TOKEN }}
          KRAFTCLOUD_METRO: fra
        run: |
          kraft login -u "robot$bigboss.users.kraftcloud" -t "$UKC_TOKEN" index.unikraft.io
          kraft cloud deploy \
            --metro fra \
            --name web-ssh-console \
            --memory 1024 \
            --port 443:3000 \
            -e APP_ENV=development \
            -e PORT=3000
