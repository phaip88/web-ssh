name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: app_db }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npx tsc --noEmit
      - name: migration test (push + audit guard)
        run: npx drizzle-kit push --force && psql "$DATABASE_URL" -f drizzle/sql/audit_guard.sql
      - name: unit + integration tests
        run: npx vitest run --reporter=verbose
      - name: seed + API contract smoke
        run: |
          npx tsx scripts/seed.ts
          npm run build
          (npx next start -p 3111 &) ; sleep 8
          curl -fsS http://127.0.0.1:3111/api/health
          curl -fsS -o /dev/null -w '%{http_code}\n' -H 'content-type: application/json' -H 'origin: http://127.0.0.1:3111' -X POST http://127.0.0.1:3111/api/auth/login -d '{"email":"admin@example.com","password":"ChangeMe-Admin-2026"}' | grep 200
      - name: dependency audit
        run: npm audit --omit=dev --audit-level=high || true   # report-only until upstream fixes land; tracked in SECURITY.md
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: SAST
        uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
  image:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: "ghcr.io/${{ github.repository }}:${{ github.sha }}", provenance: true, sbom: true }
      - name: container scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "ghcr.io/${{ github.repository }}:${{ github.sha }}", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
      - name: SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
      - uses: sigstore/cosign-installer@v3
      - name: sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
